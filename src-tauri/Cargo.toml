[package]
name = "omni-dashboard"
version = "0.1.0"
description = "A local AI continuous capture dashboard"
authors = ["You"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-autostart = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
uiautomation = "0.25"
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
rusqlite = { version = "0.31.0", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "cookies", "rustls-tls", "brotli", "gzip", "deflate"] }
ureq = { version = "2.9", features = ["json"] }
sysinfo = "0.39.6"
rodio = "0.18.1"
scraper = "0.19"
urlencoding = "2.1"
tauri-plugin-notification = "2.0.0"
tauri-plugin-dialog = "2.0.0"
pdf-extract = "0.7.2"
lopdf = "0.32"

[lib]
name = "omni_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
