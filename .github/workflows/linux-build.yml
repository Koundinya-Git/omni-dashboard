name: "Ultra-Redundant Linux Builder"

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Complete Linux Toolchain & Dev Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            clang \
            lld \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev \
            libayatana-ido3-dev \
            librsvg2-dev \
            libxdo-dev \
            libasound2-dev \
            libpulse-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libglib2.0-dev \
            libdbus-1-dev \
            libudev-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Force Patch Transitive Crates & Refresh Cargo Lock
        run: |
          cd src-tauri
          cargo update

      - name: Build Tauri Application
        run: npm run tauri build

      - name: Upload Linux Installer Artifacts (.deb)
        uses: actions/upload-artifact@v4
        with:
          name: omni-core-linux-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/**/*.deb